<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Torcons Settings</title>
  <link rel="stylesheet" href="../sidebar/sidebar.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container glass-panel">
    <header class="chat-header">
      <div class="header-logo">
        <img src="/assets/favicon-96x96.png" alt="Torcons Logo" class="logo-icon small">
        <h2>Torcons Settings</h2>
      </div>
    </header>
    
    <main class="settings-content">
      <div class="preview-section">
        <p class="setting-label">Live Preview</p>
        <div class="preview-box">
          <div class="preview-fab" id="preview-fab">
            <img src="/assets/favicon-96x96.png" alt="Torcons">
          </div>
        </div>
      </div>
      
      <div class="setting-group">
        <label for="show-fab" class="setting-label">Show Floating Button</label>
        <label class="switch">
          <input type="checkbox" id="show-fab" checked>
          <span class="slider round"></span>
        </label>
      </div>
      
      <div class="setting-group">
        <label for="fab-style" class="setting-label">Button Style</label>
        <select id="fab-style" class="model-select">
          <option value="gradient">Rich Gradient</option>
          <option value="glass">Ice Glass (Tahoe)</option>
          <option value="solid">Solid Dark</option>
        </select>
      </div>
      
      <div class="setting-group">
        <label for="fab-opacity" class="setting-label">Button Opacity: <span id="opacity-val">100%</span></label>
        <input type="range" id="fab-opacity" min="10" max="100" value="100" class="slider-range">
      </div>

      <div class="setting-group flex-col">
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 8px;">
          <label for="system-prompt" class="setting-label" style="margin-bottom: 0;">Personalized System Prompt</label>
          <div style="display: flex; align-items: center; gap: 10px;">
            <label class="switch">
              <input type="checkbox" id="use-custom-prompt">
              <span class="slider round"></span>
            </label>
          </div>
        </div>
        <textarea id="system-prompt" class="system-prompt-textarea" placeholder="Enter custom system prompt... Leave blank to use default." rows="5"></textarea>
      </div>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
